name: Render architectural corrections and publish the complete suite
on:
  push:
    branches: [master]
    paths: ['source/architectural_scenes.py', '.github/workflows/render-scene.yml']
  workflow_dispatch:
    inputs:
      scene:
        description: Architectural views to render from the current source
        type: choice
        default: all
        options: [all, 14_walnut_salon, 15_oak_library, 16_stone_kitchen, 17_parquet_detail]
permissions:
  contents: read
concurrency:
  group: cybr-suite-master
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[scene repair]') }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SCENE_SELECTION: ${{ inputs.scene || 'all' }}
        run: |
          python - <<'PY_MATRIX'
          import os,json
          keys=['14_walnut_salon','15_oak_library','16_stone_kitchen','17_parquet_detail']
          selected=os.environ['SCENE_SELECTION']
          if selected!='all':
              assert selected in keys
              keys=[selected]
          rows=[dict(scene=k,samples=768 if k.startswith('17') else 512,threshold=.005 if k.startswith('17') else .01,denoise=not k.startswith('17')) for k in keys]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(dict(include=rows))+'\n')
          PY_MATRIX
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    name: Corrected Cycles / ${{ matrix.scene }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: ./.github/actions/install-blender
      - name: Render with the native profile
        run: |
          blender -b --python source/render_path_traced.py -- --kind architecture --only '${{ matrix.scene }}' --size 2048 --samples '${{ matrix.samples }}' --min-samples 128 --threshold '${{ matrix.threshold }}' ${{ matrix.denoise && '--denoise' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-${{ matrix.scene }}
          retention-days: 1
          compression-level: 0
          path: |
            path_traced/renders/${{ matrix.scene }}.png
            path_traced/metadata/${{ matrix.scene }}.json
          if-no-files-found: error
  publish:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: architecture-*
          merge-multiple: true
          path: path_traced
      - uses: ./.github/actions/install-blender
      - name: Assemble and validate the full deliverable
        run: |
          blender -b --python source/render_path_traced.py -- --kind architecture --build-only --size 2048 --samples 512 --min-samples 128 --threshold .01 --denoise
          python source/build_suite.py --skip-maps --skip-renders
      - uses: actions/upload-artifact@v4
        with:
          name: portable-architecture-scene
          retention-days: 1
          compression-level: 0
          path: blender/CYBR_Cycles_Architecture.blend
          if-no-files-found: error
      - name: Publish corrected scenes and checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials exports blender path_traced docs OPEN_ME.html README.txt SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish smooth architectural surfaces, corrected contacts and validated V3.1.1 suite'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Publish the complete corrected archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Complete CYBR Material V3.1.1 suite: ten materials, 120 native 4K maps, Unity exports, four editable Blender files, seventeen native RGB16 Cycles renders, offline galleries, documentation, source and checksums.

          Three full 2048 × 1536 architectural interiors, individual hardwood parquet boards and a raw floor detail. Architectural surfaces use smooth, hardened normals and refined upholstery curves. The oak room's 240 books now meet their physical shelf surfaces. Floor coverage and book contacts are checked against actual saved meshes.

          Interiors use 512 maximum / 128 minimum samples with Cycles OpenImageDenoise and albedo/normal guides. The ten close-ups, three studio studies and floor detail remain raw at 768 / 128. No image-generated material inputs, picture backdrops, added grain, sharpening or upscaling.

          Unchanged maps and thirteen earlier studies are retained from the preceding validated build. All four architectural views are rerendered; their scene file is rebuilt. The complete deliverable passes the same validators and ZIP CRC check.
          NOTES
          if gh release view v3.1.1 >/dev/null 2>&1; then
            gh release edit v3.1.1 --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v3.1.1 --target master --title 'CYBR Material V3.1.1 — complete architectural suite' --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload v3.1.1 build/CYBR_Material_V3.zip build/CYBR_Material_V3.zip.sha256 build/release.json --clobber
