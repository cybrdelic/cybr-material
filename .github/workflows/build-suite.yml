name: Build and publish the material suite
on:
  push:
    branches: [master]
    paths: ['source/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cybr-suite-master
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[scene repair]') }}
jobs:
  maps:
    if: ${{ !contains(github.event.head_commit.message, '[scene repair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            source
            .github
            docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt
      - name: Generate and verify one shared native map set
        run: |
          python source/generate_materials.py --resolution 4096
          python source/pack_unity.py --pipeline hdrp
          python source/pack_unity.py --pipeline urp
          python source/verify_maps.py
      - uses: actions/upload-artifact@v4
        with:
          name: procedural-map-build
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            materials/
            exports/
            docs/map_checks.json
  render:
    needs: maps
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {key: 01_calacatta_oro_detail, material: 01_calacatta_oro, kind: macros, size: 1024, threshold: .005}
          - {key: 02_roman_travertine_detail, material: 02_roman_travertine, kind: macros, size: 1024, threshold: .005}
          - {key: 03_american_walnut_detail, material: 03_american_walnut, kind: macros, size: 1024, threshold: .005}
          - {key: 04_fumed_oak_detail, material: 04_fumed_oak, kind: macros, size: 1024, threshold: .005}
          - {key: 05_champagne_brass_detail, material: 05_champagne_brass, kind: macros, size: 1024, threshold: .005}
          - {key: 06_blackened_steel_detail, material: 06_blackened_steel, kind: macros, size: 1024, threshold: .005}
          - {key: 07_bone_porcelain_detail, material: 07_bone_porcelain, kind: macros, size: 1024, threshold: .005}
          - {key: 08_saddle_leather_detail, material: 08_saddle_leather, kind: macros, size: 1024, threshold: .005}
          - {key: 09_lime_plaster_detail, material: 09_lime_plaster, kind: macros, size: 1024, threshold: .005}
          - {key: 10_natural_linen_detail, material: 10_natural_linen, kind: macros, size: 1024, threshold: .005}
          - {key: 11_stone_and_timber, material: 11_stone_and_timber, kind: scenes, size: 1280, threshold: .008}
          - {key: 12_leather_and_linen, material: 12_leather_and_linen, kind: scenes, size: 1280, threshold: .008}
          - {key: 13_metal_and_ceramic, material: 13_metal_and_ceramic, kind: scenes, size: 1280, threshold: .008}
          - {key: 14_walnut_salon, material: 14_walnut_salon, kind: architecture, size: 2048, threshold: .01, samples: 512, denoise: true}
          - {key: 15_oak_library, material: 15_oak_library, kind: architecture, size: 2048, threshold: .01, samples: 512, denoise: true}
          - {key: 16_stone_kitchen, material: 16_stone_kitchen, kind: architecture, size: 2048, threshold: .01, samples: 512, denoise: true}
          - {key: 17_parquet_detail, material: 17_parquet_detail, kind: architecture, size: 2048, threshold: .005, samples: 768, denoise: false}
    name: Cycles / ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            source
            .github
      - uses: actions/download-artifact@v4
        with:
          name: procedural-map-build
          path: .
      - uses: ./.github/actions/install-blender
      - name: Path trace the native scene
        run: |
          mkdir -p blender
          blender -b --python source/render_path_traced.py -- --kind '${{ matrix.kind }}' --only '${{ matrix.material }}' --size '${{ matrix.size }}' --samples '${{ matrix.samples || 768 }}' --min-samples 128 --threshold '${{ matrix.threshold }}' ${{ matrix.denoise && '--denoise' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: cycles-${{ matrix.key }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            path_traced/renders/${{ matrix.key }}.png
            path_traced/metadata/${{ matrix.key }}.json
  publish:
    needs: [maps, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: procedural-map-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: cycles-*
          merge-multiple: true
          path: path_traced
      - uses: ./.github/actions/install-blender
      - name: Assemble portable scenes, inspect outputs and package
        run: |
          mkdir -p blender
          blender -b --python source/render_path_traced.py -- --kind macros --build-only --size 1024 --samples 768 --min-samples 128 --threshold .005
          blender -b --python source/render_path_traced.py -- --kind scenes --build-only --size 1280 --samples 768 --min-samples 128 --threshold .008
          blender -b --python source/render_path_traced.py -- --kind architecture --build-only --size 2048 --samples 512 --min-samples 128 --threshold .01 --denoise
          python -c 'from pathlib import Path; Path("path_traced/render_manifest.json").write_text("{}\n")'
          python source/build_suite.py --skip-maps --skip-renders
      - name: Commit the complete generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materials exports blender path_traced docs OPEN_ME.html README.txt SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V3.1 architectural interiors, hardwood floors and complete suite'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - name: Publish the downloadable suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Complete CYBR Material V3.1 suite: ten custom materials, 120 native 4K maps, Unity exports, four editable Blender files, seventeen genuine Cycles renders, offline galleries, before/after images, source and checksums.

          All ten materials use native 4K procedural maps. Wood is sampled from a radial growth volume with physically sized vessels and rays. No source images or image-generated material inputs are used. The wood maps are finite board cuts; the suite is not scanned material data.

          New 2048 × 1536 scenes: a seven-meter walnut herringbone salon, an oak basket-parquet reading room, a stone kitchen atelier, and a raw parquet detail. Floors contain individually cut boards with physical stock dimensions, joints and eased edges. No scene images or backdrops are generated from pictures.

          The three full interiors use Cycles' OpenImageDenoise with albedo and normal guides at 512 maximum / 128 minimum samples. The ten material close-ups, three studio studies and new floor detail remain raw at 768 / 128 samples. Every native render is RGB16 PNG; no sharpening, artificial grain or image upscaling is applied. The critical review documents corrected floor gaps, furniture contacts and remaining material limits.
          NOTES
          if gh release view v3.1.1 >/dev/null 2>&1; then
            gh release edit v3.1.1 --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v3.1.1 --target master --title 'CYBR Material V3.1.1 — architectural interiors and hardwood floors' --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload v3.1.1 build/CYBR_Material_V3.zip build/CYBR_Material_V3.zip.sha256 build/release.json --clobber
