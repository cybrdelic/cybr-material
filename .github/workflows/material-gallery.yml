name: Validate and publish material gallery
on:
  pull_request:
    paths: ['gallery/**', 'tools/gallery/**', 'docs/MATERIAL_GALLERY.md', 'docs/GALLERY_MAINTENANCE.md', '.github/workflows/material-gallery.yml']
  push:
    branches: [master]
    paths: ['gallery/**', 'tools/gallery/**', 'docs/MATERIAL_GALLERY.md', 'docs/GALLERY_MAINTENANCE.md', '.github/workflows/material-gallery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: material-gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/gallery/verify.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/gallery-browser" playwright@1.62.1
          "$RUNNER_TEMP/gallery-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check desktop, mobile and no-JavaScript behavior
        env:
          NODE_PATH: ${{ runner.temp }}/gallery-browser/node_modules
          GALLERY_SCREENSHOTS: ${{ runner.temp }}/gallery-screenshots
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/gallery-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/gallery/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/gallery/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-screenshots
          path: ${{ runner.temp }}/gallery-screenshots
          if-no-files-found: ignore
      - name: Package original files for static hosting
        if: github.event_name != 'pull_request'
        run: python tools/gallery/package.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/material-gallery
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
